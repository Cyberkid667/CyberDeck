# Identifiant neutre de CyberDeck (le même que l'AppUserModelId de main/index.ts).
# Il diffère de celui d'Essaim / CyberTorrent / CyberLink (fr.essaim.app) : l'installateur
# ne remplace pas l'ancienne version, à désinstaller à part (ses données sont reprises au
# premier lancement, voir main/index.ts).
appId: app.cyberdeck.launcher
productName: CyberDeck
copyright: Copyright © 2026 Cyberkid667
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
  # crédits des données livrées (DB-IP, CC BY 4.0 ; Natural Earth)
  - ATTRIBUTION.md
# Les modules natifs (uTP, WebRTC) sont livrés précompilés en N-API :
# pas besoin de les recompiler pour Electron.
npmRebuild: false
asarUnpack:
  - '**/*.node'
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: CyberDeck-${version}-Setup.${ext}
nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: CyberDeck
  deleteAppDataOnUninstall: false
# Linux (Steam et jeux locaux seulement, voir README) : construit par .github/workflows/linux.yml
# sur ubuntu-latest, où `npm ci` installe les modules natifs précompilés pour Linux.
linux:
  icon: build/icon.png
  category: Game
  maintainer: Cyberkid667
  vendor: Cyberkid667
  synopsis: Unified game library for Steam
  executableName: cyberdeck
  target:
    - target: AppImage
      arch: [x64]
    - target: tar.gz
      arch: [x64]
  artifactName: CyberDeck-${version}-x86_64.${ext}
